type: object

required:
  - code
  - stationName
  - state
  - zone

properties:

  code:
    type: string
    minLength: 2
    maxLength: 10
    pattern: '^[A-Z]{2,5}$'
    example: "RU"

  stationName:
    type: string
    minLength: 2
    maxLength: 100
    example: "Renigunta Junction"

  state:
    type: string
    minLength: 2
    maxLength: 50
    example: "Andhra Pradesh"

  zone:
    $ref: './zone.yaml'